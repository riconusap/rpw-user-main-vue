version: '3.8'

# Development-specific docker-compose configuration
services:
  dev:
    build:
      context: .
      target: development
    container_name: rpw-law-firm-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Prevent overwriting node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_PORT=3000
    command: npm run dev -- --host 0.0.0.0 --port 3000
    stdin_open: true
    tty: true
    networks:
      - rpw-network
    restart: unless-stopped

networks:
  rpw-network:
    driver: bridge
