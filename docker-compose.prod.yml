version: '3.8'

# Production-specific docker-compose configuration
services:
  prod:
    build:
      context: .
      target: production
    container_name: rpw-law-firm-prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - rpw-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  rpw-network:
    driver: bridge
