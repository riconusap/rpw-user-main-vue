version: '3.8'

services:
  # Development service
  dev:
    build:
      context: .
      target: development
    container_name: rpw-law-firm-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0
    stdin_open: true
    tty: true
    networks:
      - rpw-network

  # Production service
  prod:
    build:
      context: .
      target: production
    container_name: rpw-law-firm-prod
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    networks:
      - rpw-network
    restart: unless-stopped

networks:
  rpw-network:
    driver: bridge
